<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotografía — Paula López Román</title>
  <script>
    if (location.hash === '#desde-sobre') {
      document.documentElement.classList.add('from-envelope');
      history.replaceState(history.state, '', location.pathname + location.search);
    }
  </script>
  <link rel="stylesheet" href="/portfolio/estilos.css?v=portfolio-copyright">
  <style>
    body { margin: 0; background: #fff; }
    @media (prefers-reduced-motion: no-preference) {
      .from-envelope body { animation: gallery-appear 650ms ease-out backwards; }
      @keyframes gallery-appear { from { opacity: 0; } to { opacity: 1; } }
    }
    .gallery-header {
      position: sticky;
      top: 0;
      z-index: 10;
      mix-blend-mode: difference;
    }
    .gallery-header a { color: #fff; }
    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(6px, 1vw, 14px);
      max-width: 1600px;
      margin-inline: auto;
      padding: clamp(6px, 1vw, 14px);
    }
    .photo-gallery img {
      display: block;
      width: 100%;
      height: auto;
      grid-column: 1 / -1;
    }
    .photo-gallery .gallery-portrait { grid-column: 1; }
    .photo-gallery .gallery-portrait-right { grid-column: 2; }
  </style>
</head>
<body>
  <header class="portfolio-blank-header gallery-header">
    <a class="portfolio-brand" href="/portfolio/#nube">Paula López Román</a>
    <nav aria-label="Navegación principal"><a href="/portfolio/projects"><span>Proyectos</span><sup>1</sup></a><a href="/portfolio/sobre-mi"><span>Sobre mi</span><sup>2</sup></a><a href="/portfolio/hablamos"><span>Hablemos</span><sup>3</sup></a></nav>
